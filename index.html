<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pixel Art Mágico ✨</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
    <style>
        :root {
            --bg-color: #f0f8ff;
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --dark: #2C3E50;
            --light: #ffffff;
            --panel-width: 320px;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            height: 100vh; /* Ocupar toda la altura */
            display: flex;
            flex-direction: row; /* Elementos lado a lado */
            overflow: hidden; /* Evitar scroll en la página principal */
            user-select: none;
        }

        /* --- ZONA IZQUIERDA: EL LIENZO --- */
        .canvas-area {
            flex: 1; /* Ocupa todo el espacio sobrante */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(#e0e7ff 15%, transparent 16%),
                radial-gradient(#e0e7ff 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        #canvas-container {
            display: grid;
            background-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 4px solid var(--dark);
            cursor: crosshair;
            touch-action: none;
            /* El tamaño se calcula en JS */
        }

        .pixel {
            width: 100%;
            height: 100%;
            border: 1px solid #f0f0f0;
            box-sizing: border-box;
        }

        /* --- ZONA DERECHA: CONTROLES --- */
        .sidebar {
            width: var(--panel-width);
            background: var(--light);
            border-left: 4px solid var(--secondary);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.05);
            overflow-y: auto; /* Scroll si la pantalla es bajita */
            gap: 20px;
            z-index: 10;
        }

        h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.8rem;
            text-align: center;
            text-shadow: 2px 2px 0px #ffeaa7;
            line-height: 1.2;
        }

        .section-title {
            font-size: 1rem;
            color: var(--dark);
            opacity: 0.7;
            text-align: center;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* Herramientas Principales */
        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background: #eee;
            border: none;
            border-radius: 12px;
            padding: 15px 5px;
            font-size: 1.5rem;
            cursor: pointer;
            border-bottom: 4px solid #ccc;
            transition: all 0.1s;
        }

        button:active {
            transform: translateY(4px);
            border-bottom: 0px solid #ccc;
        }

        button.active {
            background: var(--secondary);
            color: white;
            border-bottom-color: #2a9d8f;
        }

        #btn-clear {
            width: 100%;
            background: #ffadad;
            color: white;
            border-bottom-color: #e07a7a;
            margin-top: 10px;
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border-radius: 10px;
            border: 2px solid var(--secondary);
            font-family: inherit;
            margin-bottom: 10px;
        }

        /* Paleta de Colores en Rejilla */
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 columnas */
            gap: 10px;
            justify-items: center;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 15px;
        }

        .swatch {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        .swatch:hover { transform: scale(1.2); }
        .swatch.selected { border-color: var(--dark); transform: scale(1.1); box-shadow: 0 0 0 2px var(--secondary); }

        /* Input nativo disimulado */
        #colorPicker {
            width: 100%;
            height: 40px;
            border: none;
            cursor: pointer;
            background: transparent;
        }

        /* --- RESPONSIVE (Móviles) --- */
        @media (max-width: 800px) {
            body {
                flex-direction: column; /* Volver a vertical en móviles */
                height: auto;
                overflow: visible;
            }
            .canvas-area {
                height: auto;
                min-height: 50vh;
            }
            .sidebar {
                width: 100%;
                border-left: none;
                border-top: 4px solid var(--secondary);
                box-sizing: border-box;
            }
            .palette-grid {
                grid-template-columns: repeat(6, 1fr); /* Más columnas en móvil */
            }
        }
    </style>
</head>
<body>

    <div class="canvas-area">
        <div id="canvas-container"></div>
    </div>

    <div class="sidebar">
        <h1>🎨 Pixel Art Mágico</h1>
        
        <div>
            <div class="section-title">TAMAÑO</div>
            <select id="sizePicker">
                <option value="8">8 x 8 (Grande)</option>
                <option value="16" selected>16 x 16 (Normal)</option>
                <option value="32">32 x 32 (Pequeño)</option>
            </select>
        </div>

        <div>
            <div class="section-title">HERRAMIENTAS</div>
            <div class="tools-grid">
                <button id="btn-pencil" class="active" title="Lápiz">✏️ Lápiz</button>
                <button id="btn-eraser" title="Goma">🧽 Goma</button>
            </div>
            <div style="margin-top:10px; text-align:center;">
                <input type="color" id="colorPicker" value="#000000" title="Mezclar color propio">
                <span style="font-size:0.8rem; color:#666;">👆 Toca para mezclar</span>
            </div>
        </div>

        <div>
            <div class="section-title">COLORES</div>
            <div id="palette-container" class="palette-grid">
                </div>
        </div>

        <button id="btn-clear">🗑️ BORRAR TODO</button>
    </div>

    <script>
        // --- Configuración ---
        const PRESET_COLORS = [
            '#000000', '#555555', '#AAAAAA', '#FFFFFF', 
            '#8B4513', '#D2691E', '#FFDEAD', '#F0E68C', 
            '#FF0000', '#FF69B4', '#FF4500', '#FFA500', 
            '#FFD700', '#FFFF00', '#ADFF2F', '#008000', 
            '#00FFFF', '#00BFFF', '#0000FF', '#8A2BE2'  
        ];

        // --- Elementos ---
        const canvasContainer = document.getElementById('canvas-container');
        const colorPicker = document.getElementById('colorPicker');
        const paletteContainer = document.getElementById('palette-container');
        const sizePicker = document.getElementById('sizePicker');
        const btnPencil = document.getElementById('btn-pencil');
        const btnEraser = document.getElementById('btn-eraser');
        const btnClear = document.getElementById('btn-clear');

        // --- Estado ---
        let isDrawing = false;
        let currentMode = 'pencil';
        let currentSize = 16;

        function init() {
            generatePalette();
            
            // Recuperar datos
            const savedSize = localStorage.getItem('pixelart_size');
            if (savedSize) {
                currentSize = parseInt(savedSize);
                sizePicker.value = currentSize;
            }

            const savedColor = localStorage.getItem('pixelart_color');
            if (savedColor) {
                colorPicker.value = savedColor;
                highlightSwatch(savedColor);
            } else {
                highlightSwatch('#000000');
            }

            createGrid(currentSize);
            loadDrawing();

            // Ajustar grid si cambia ventana
            window.addEventListener('resize', () => {
                resizeCanvas(); // Solo ajusta tamaño visual
            });
        }

        function generatePalette() {
            paletteContainer.innerHTML = '';
            PRESET_COLORS.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'swatch';
                swatch.style.backgroundColor = color;
                swatch.onclick = () => {
                    colorPicker.value = color;
                    highlightSwatch(color);
                    setMode('pencil');
                    saveState();
                };
                paletteContainer.appendChild(swatch);
            });
        }

        function highlightSwatch(colorHex) {
            const normalizedColor = colorHex.toUpperCase();
            document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
            const swatches = document.querySelectorAll('.swatch');
            for(let s of swatches) {
                if (rgbToHex(s.style.backgroundColor).toUpperCase() === normalizedColor || 
                    s.style.backgroundColor === colorHex) {
                    s.classList.add('selected');
                }
            }
        }

        function rgbToHex(col) {
            if(col.charAt(0)=='#') return col;
            col=col.split('(')[1].split(')')[0].split(',');
            var hex = x => { var n=parseInt(x).toString(16); return (n.length==1) ? "0"+n : n; }
            return "#" + hex(col[0]) + hex(col[1]) + hex(col[2]);
        }

        function createGrid(size) {
            canvasContainer.innerHTML = '';
            
            // Configurar grid CSS
            canvasContainer.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            canvasContainer.style.gridTemplateRows = `repeat(${size}, 1fr)`;

            // Crear pixeles
            for (let i = 0; i < size * size; i++) {
                const pixel = document.createElement('div');
                pixel.classList.add('pixel');
                pixel.addEventListener('mousedown', startDrawing);
                pixel.addEventListener('mouseover', draw);
                pixel.addEventListener('mouseup', stopDrawing);
                pixel.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); draw(e); });
                canvasContainer.appendChild(pixel);
            }
            
            resizeCanvas(); // Calcular tamaño inicial
        }

        // Función inteligente para calcular el tamaño máximo posible del cuadrado
        function resizeCanvas() {
            const sidePanelWidth = window.innerWidth > 800 ? 320 : 0; // Si es escritorio, restamos panel
            const availableWidth = window.innerWidth - sidePanelWidth - 40; // 40px padding
            const availableHeight = window.innerHeight - 40; // 40px padding
            
            // Queremos un cuadrado, así que cogemos el lado más pequeño disponible
            const maxSize = Math.min(availableWidth, availableHeight);
            
            // Protecciones para que no sea ni muy pequeño ni rompa layout
            const finalSize = Math.max(300, maxSize); 

            canvasContainer.style.width = `${finalSize}px`;
            canvasContainer.style.height = `${finalSize}px`;
        }

        function startDrawing(e) { isDrawing = true; draw(e); }
        function stopDrawing() { isDrawing = false; saveDrawing(); }

        function draw(e) {
            if (!isDrawing) return;
            let target;
            if (e.type.includes('touch')) {
                const touch = e.touches[0];
                target = document.elementFromPoint(touch.clientX, touch.clientY);
            } else {
                target = e.target;
            }

            if (target && target.classList.contains('pixel')) {
                if (currentMode === 'pencil') {
                    target.style.backgroundColor = colorPicker.value;
                } else {
                    target.style.backgroundColor = 'white';
                }
            }
        }

        document.body.addEventListener('mouseup', () => { if(isDrawing) { isDrawing = false; saveDrawing(); } });

        function setMode(mode) {
            currentMode = mode;
            btnPencil.classList.toggle('active', mode === 'pencil');
            btnEraser.classList.toggle('active', mode === 'eraser');
        }

        btnPencil.addEventListener('click', () => setMode('pencil'));
        btnEraser.addEventListener('click', () => setMode('eraser'));

        colorPicker.addEventListener('change', () => {
            setMode('pencil');
            highlightSwatch(colorPicker.value);
            saveState();
        });

        btnClear.addEventListener('click', () => {
            if(confirm('¿Borrar dibujo? 🗑️')) {
                document.querySelectorAll('.pixel').forEach(p => p.style.backgroundColor = 'white');
                saveDrawing();
            }
        });

        sizePicker.addEventListener('change', (e) => {
            if(confirm('Cambiar tamaño borrará el dibujo. ¿Seguro?')) {
                currentSize = parseInt(e.target.value);
                localStorage.setItem('pixelart_size', currentSize);
                localStorage.removeItem('pixelart_data'); 
                createGrid(currentSize);
            } else {
                e.target.value = currentSize;
            }
        });

        function saveState() { localStorage.setItem('pixelart_color', colorPicker.value); }

        function saveDrawing() {
            const pixels = document.querySelectorAll('.pixel');
            const gridData = [];
            pixels.forEach(p => {
                const c = p.style.backgroundColor;
                gridData.push((c === 'white' || c === '') ? null : c);
            });
            localStorage.setItem('pixelart_data', JSON.stringify(gridData));
        }

        function loadDrawing() {
            const data = localStorage.getItem('pixelart_data');
            if (!data) return;
            const gridData = JSON.parse(data);
            const pixels = document.querySelectorAll('.pixel');
            if (gridData.length !== pixels.length) return;
            pixels.forEach((p, i) => { if(gridData[i]) p.style.backgroundColor = gridData[i]; });
        }

        init();
    </script>
</body>
</html>
